data:
  preprocessed_dir: artifacts/pamap2_baseline_protocol_5act
  output_dir: artifacts/pamap2_sdforger_dataset_smoke
  split_strategy: subject
  train_subjects: [101, 102, 103, 104, 105, 106]
  val_subjects: [107]
  test_subjects: [108]
  random_seed: 42

embedding:
  method: fastica
  n_components: 3
  variance_explained: 0.7
  input_tokens_precision: 4
  permute_columns: true
  text_template: fim_template_textual_encoding
  include_context_columns: true
  reducer_artifact_name: reducer.pkl

training:
  model_id_or_path: openai-community/gpt2
  output_dir: outputs/checkpoints/gpt2_smoke
  learning_rate: 8.0e-5
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 1
  warmup_ratio: 0.0
  weight_decay: 0.0
  logging_steps: 1
  eval_steps: 5
  save_steps: 5
  save_total_limit: 2
  seed: 42
  max_seq_length: 512
  use_fp16: false
  use_bf16: false
  gradient_checkpointing: false
  early_stopping_patience: 2
  dataloader_num_workers: 0
  report_to: [tensorboard]
  peft:
    enabled: false

generation:
  prompt_split: test
  max_new_tokens: 512
  min_new_tokens: 360
  num_return_sequences: 1
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  do_sample: false
  repetition_penalty: 1.0
  batch_size: 2
  max_prompts: 12
  norm_filter_iqr_factor: 3.0
  deduplicate: true
  output_dir: outputs/generated/gpt2_smoke

similarity:
  max_lag: 16
  max_samples_per_activity: 16
  dtw_window: 32
  random_seed: 42
  output_dir: outputs/evaluation/similarity/gpt2_smoke

utility:
  classifier: random_forest
  random_seed: 42
  output_dir: outputs/evaluation/utility/gpt2_smoke
  n_estimators: 64
  max_depth: 8

plots:
  output_dir: outputs/plots/gpt2_smoke
  max_examples_per_activity: 1
  embedding_scatter_max_points: 200

smoke:
  source_dataset_dir: artifacts/pamap2_sdforger_dataset
  output_dataset_dir: artifacts/pamap2_sdforger_dataset_smoke
  train_samples: 64
  val_samples: 16
  test_samples: 16
  random_seed: 42
