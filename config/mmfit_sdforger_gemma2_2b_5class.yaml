data:
  preprocessed_dir: data/mmfit/raw/mm-fit.zip
  output_dir: artifacts/mmfit_sdforger_dataset_5class
  split_strategy: session
  train_subjects: [1, 2, 3, 4, 6, 7, 8, 16, 17, 18]
  val_subjects: [14, 15, 19]
  test_subjects: [0, 5, 12, 13, 20]
  random_seed: 42

embedding:
  method: fastica
  n_components: 6
  variance_explained: 0.7
  standardization: per_channel_train
  fastica_max_iter: 3000
  fastica_tol: 0.001
  input_tokens_precision: 4
  permute_columns: false
  text_template: mmfit_structured_v1
  include_context_columns: true
  reducer_artifact_name: reducer.pkl
  scaler_artifact_name: channel_scaler.json

training:
  model_id_or_path: google/gemma-2-2b
  output_dir: outputs/checkpoints/mmfit_gemma2_2b_5class
  learning_rate: 2.0e-4
  num_train_epochs: 5
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 2
  seed: 42
  max_seq_length: 1536
  use_fp16: true
  use_bf16: false
  gradient_checkpointing: true
  early_stopping_patience: 5
  dataloader_num_workers: 2
  report_to: [tensorboard]
  peft:
    enabled: true
    method: lora
    r: 16
    alpha: 32
    dropout: 0.05
    bias: none
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    task_type: CAUSAL_LM

generation:
  prompt_split: test
  max_new_tokens: 1536
  min_new_tokens: 700
  num_return_sequences: 1
  temperature: 0.7
  top_p: 0.9
  top_k: 20
  do_sample: true
  repetition_penalty: 1.05
  batch_size: 2
  max_prompts: null
  norm_filter_iqr_factor: 3.0
  deduplicate: true
  output_dir: outputs/generated/mmfit_gemma2_2b_5class

similarity:
  max_lag: 32
  max_samples_per_activity: 128
  dtw_window: null
  random_seed: 42
  output_dir: outputs/evaluation/similarity/mmfit_gemma2_2b_5class

utility:
  classifier: random_forest
  random_seed: 42
  output_dir: outputs/evaluation/utility/mmfit_gemma2_2b_5class
  n_estimators: 300
  max_depth: null

plots:
  output_dir: outputs/plots/mmfit_gemma2_2b_5class
  max_examples_per_activity: 3
  embedding_scatter_max_points: 1000

